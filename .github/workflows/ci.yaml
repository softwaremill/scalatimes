name: CI
on:
  pull_request:
  push:
    branches:
      - master
  release:
    types:
      - released

env:
  GCR_REGISTRY: europe-west2-docker.pkg.dev/sml-gke-iac
  GCR_REPOSITORY: scalatimes
  IMAGE: scalatimes

jobs:
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Get release or tag
        uses: tenhaus/get-release-or-tag@db458cc32a8bb175ad2d1c1b6aae6200653c625f # v2
        id: tag
      - name: "Authenticate to Google Cloud"
        id: "auth"
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed" # v2.1.13
        with:
          project_id: sml-gke-iac
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
          token_format: "access_token"
      - name: Login to docker registry
        uses: "docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9" # v3.7.0
        with:
          registry: "europe-west2-docker.pkg.dev"
          username: "oauth2accesstoken"
          password: "${{ steps.auth.outputs.access_token }}"
      - name: Build Docker image and push to GCR
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -t $GCR_REGISTRY/$GCR_REPOSITORY/$IMAGE:$IMAGE_TAG .
          docker push $GCR_REGISTRY/$GCR_REPOSITORY/$IMAGE:$IMAGE_TAG
          echo "... image has been built and pushed to $GCR_REGISTRY/$GCR_REPOSITORY/$IMAGE:$IMAGE_TAG"
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GHA_SML_GITOPS_APP_ID }}
          private-key: ${{ secrets.GHA_SML_GITOPS_APP_KEY }}
          owner: softwaremill
          repositories: sml-gitops
      - name: Checkout sml-gitops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: softwaremill/sml-gitops
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: sml-gitops
      - name: Update prod image tag
        working-directory: sml-gitops/apps/overlays/visdom-orchestrator
        env:
          IMAGE_FULL_TAG: ${{ env.GCR_REGISTRY }}/${{ env.GCR_REPOSITORY }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
        run: kustomize edit set image "$IMAGE_FULL_TAG"
      - name: Commit and push
        working-directory: sml-gitops
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/overlays/scalatimes
          if git diff --cached --quiet; then
            echo "Overlay already up to date — nothing to deploy."
          else
            git commit -m "Deploy ${IMAGE_FULL_TAG} (triggered by ${GITHUB_ACTOR})"
            git push "https://x-access-token:${TOKEN}@github.com/softwaremill/sml-gitops.git" HEAD:main
          fi
